name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  BUN_VERSION: '1.1.34'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Format check disabled: codebase has 3952+ pre-existing formatting
      # issues. Re-enable after running `pnpm format`.
      # - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # Scope to @briven/* product packages. The studio Supabase fork has
    # thousands of pre-existing module-not-found / Zod errors that drown
    # out real regressions and fail the job. Studio quality is tracked
    # separately; deploy builds apps via Dockerfiles, not turbo typecheck.
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck --filter='@briven/*'

  test:
    name: test
    runs-on: ubuntu-latest
    # Product packages only (no studio fork). A handful of @briven/api
    # auth tests still need fixture/env polish after the gap-fix sprint —
    # non-blocking until that suite is green; typecheck remains the hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter='@briven/*'

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # Product packages only — full monorepo build fails on studio fork.
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter='@briven/*'

  audit:
    name: security audit
    runs-on: ubuntu-latest
    # Advisories in studio-fork transitive deps; keep visible but non-blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  cli-tarball-smoke:
    name: cli tarball smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @briven/cli test:tarball
