name: Deploy to Dokploy

# =============================================================================
# HARD STOP — AUTO-DEPLOY DISABLED (2026-07-18)
# =============================================================================
# This workflow is intentionally inert.
# - No `push` trigger (will not run on git push)
# - Job is permanently skipped (`if: false`)
# - Also disabled in GitHub UI: Actions → Deploy to Dokploy → Disable workflow
#
# When you WANT a deploy later:
# 1. Re-enable the workflow in GitHub Actions settings
# 2. Restore a real job body (see git history for 421ae07 / earlier)
# 3. Run workflow_dispatch once
#
# Do NOT re-add `on: push` without flndrn explicit approval.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to allow a future re-enable of this workflow body'
        required: true
        default: ''

jobs:
  deploy-disabled:
    name: auto-deploy is OFF
    runs-on: ubuntu-latest
    # Permanent skip — never calls Dokploy.
    if: false
    steps:
      - name: noop
        run: echo "This job never runs. Auto-deploy is fully disabled."
