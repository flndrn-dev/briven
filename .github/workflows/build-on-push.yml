name: build-on-push

# Stage 1 of off-server builds: on every push to main, build the five
# briven app images on GitHub's runners (NOT on the France VPS) and push
# them to ghcr. This is ADDITIVE — it does not change how Dokploy deploys
# yet, so it cannot break the running site. Once these images are proven,
# the compose is switched to PULL them (Stage 2) and the deploy trigger is
# flipped to fire after the build (Stage 3).
#
# amd64 only (the France VPS is amd64) → fast builds, no qemu.
# Tag :main is a moving pointer at the latest main build; :sha-<commit> is
# an immutable pin so a deploy can reference an exact build if needed.

# Push-triggered builds OFF by default — was firing on every main commit and
# adding load/noise. Run manually from Actions when you want new GHCR images.
on:
  workflow_dispatch: {}

concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Repo owner namespace — GITHUB_TOKEN can push here without a PAT.
  IMAGE_OWNER: flndrn-dev

jobs:
  build:
    name: build · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, runtime, realtime, web, docs]
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/briven-${{ matrix.app }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/briven-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
