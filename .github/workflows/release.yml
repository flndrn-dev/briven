name: release

# Builds + pushes the five briven service images to GHCR on every git
# tag matching `v*.*.*`. The tag becomes the image tag; `:latest` also
# moves to the new build.
#
# Self-hosters pin a version in their `infra/dokploy/.env`:
#   BRIVEN_VERSION=v0.5.0
# and `docker compose pull && up -d` to upgrade.

on:
  push:
    tags: ['v*.*.*']
  # Manual trigger lets j ship a release-candidate (e.g. v0.5.0-rc.1) by
  # entering a tag in the GitHub Actions UI without bumping the repo.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (e.g. v0.5.0). Skip to use the current ref.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: flndrn-dev

jobs:
  build:
    name: build · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Each service is independent — a failure in one shouldn't kill the
      # other four. The `fail-fast: false` here matches that intent.
      fail-fast: false
      matrix:
        service: [api, runtime, realtime, web, docs]
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfiles all live in apps/<service>/Dockerfile but
          # the build context is the repo root so they can copy the
          # workspace pnpm-lock + tsconfig.base.
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          # arm64 lets self-hosters run on Hetzner CAX / AWS Graviton /
          # Apple Silicon dev machines without an emulator round-trip.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/briven-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/briven-${{ matrix.service }}:latest
          cache-from: type=gha,scope=briven-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=briven-${{ matrix.service }}
          provenance: true
          sbom: true

  notify:
    name: notify
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Compose summary
        run: |
          status="${{ needs.build.result }}"
          tag="${{ inputs.tag || github.ref_name }}"
          echo "release: ${tag}, build status: ${status}" >> "$GITHUB_STEP_SUMMARY"
          for s in api runtime realtime web docs; do
            echo "- ghcr.io/${{ env.ORG }}/briven-${s}:${tag}" >> "$GITHUB_STEP_SUMMARY"
          done
