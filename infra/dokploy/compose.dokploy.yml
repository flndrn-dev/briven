# briven-core — Dokploy-managed compose template.
#
# Use this file when adding briven as a managed Compose project on a host
# that already runs Dokploy. Differences from the plain `compose.yml`:
#   - the four traefik-fronted services attach to the existing
#     `dokploy-network` overlay (external) so dokploy-traefik routes to
#     them out of the box;
#   - container_name is omitted (Dokploy assigns its own slug);
#   - no `briven` private bridge network — every service is on
#     dokploy-network and resolves siblings by service name.
#
# Required env (set on the Dokploy compose project's Environment tab):
#
#   BRIVEN_DOMAIN                  e.g. briven.tech
#   BRIVEN_BETTER_AUTH_SECRET     openssl rand -hex 32
#   BRIVEN_AUDIT_IP_PEPPER        openssl rand -hex 32
#   BRIVEN_ENCRYPTION_KEY         openssl rand -hex 32
#   BRIVEN_RUNTIME_SHARED_SECRET  openssl rand -hex 32
#   BRIVEN_POSTGRES_PASSWORD      strong; used by every service
#   BRIVEN_MITTERA_API_URL        optional — base URL of mittera.eu (e.g. https://api.mittera.eu)
#   BRIVEN_MITTERA_API_KEY        optional — bearer token for outbound POST /api/v1/emails
#   BRIVEN_MITTERA_WEBHOOK_SECRET optional — HMAC secret for inbound webhook verification
#   BRIVEN_GOOGLE_CLIENT_ID       optional — google oauth signin
#   BRIVEN_GOOGLE_CLIENT_SECRET   optional
#   BRIVEN_OPEN_SIGNUPS           true | false (default false)
#   BRIVEN_STUDIO_USERNAME        optional — studio dashboard basic-auth user (default: briven)
#   BRIVEN_STUDIO_PASSWORD        REQUIRED in prod — studio dashboard basic-auth password
#   BRIVEN_STUDIO_ANON_KEY        optional — placeholder until kong/gotrue wired
#   BRIVEN_STUDIO_SERVICE_KEY     optional — placeholder until kong/gotrue wired
#
# Per DOCKER.md §7: every service caps its log volume to prevent any one
# noisy container from filling the host disk. Applied via the anchor
# below.

x-logging: &briven-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *briven-logging
    environment:
      POSTGRES_PASSWORD: ${BRIVEN_POSTGRES_PASSWORD}
      POSTGRES_DB: briven_control
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - dokploy-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *briven-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *briven-logging
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: briven
      MINIO_ROOT_PASSWORD: ${BRIVEN_POSTGRES_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Public S3 endpoint — browsers PUT/GET against this host using the
      # sigv4-presigned URLs minted by the api. The api also speaks to
      # MinIO on the internal docker network via `http://minio:9000`.
      - traefik.http.routers.briven-s3.rule=Host(`s3.${BRIVEN_DOMAIN}`)
      - traefik.http.routers.briven-s3.entrypoints=websecure
      - traefik.http.routers.briven-s3.tls.certresolver=letsencrypt
      - traefik.http.routers.briven-s3.service=briven-s3
      - traefik.http.services.briven-s3.loadbalancer.server.port=9000

  # One-shot bucket creator. mc accepts repeated `mb` against an existing
  # bucket without erroring (with the --ignore-existing flag), so this is
  # idempotent — runs every deploy, no-ops after the first.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    networks:
      - dokploy-network
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set minio http://minio:9000 briven ${BRIVEN_POSTGRES_PASSWORD} >/dev/null 2>&1; do
          echo 'waiting for minio...'; sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing minio/${BRIVEN_MINIO_BUCKET:-briven};
        echo 'minio bucket ready: ${BRIVEN_MINIO_BUCKET:-briven}';
      "
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *briven-logging
    depends_on: [postgres, redis]
    environment:
      BRIVEN_ENV: production
      BRIVEN_API_PORT: '3001'
      BRIVEN_API_ORIGIN: https://api.${BRIVEN_DOMAIN}
      BRIVEN_WEB_ORIGIN: https://${BRIVEN_DOMAIN}
      BRIVEN_TRUSTED_ORIGINS: https://${BRIVEN_DOMAIN},https://api.${BRIVEN_DOMAIN}
      BRIVEN_DATABASE_URL: postgres://postgres:${BRIVEN_POSTGRES_PASSWORD}@postgres:5432/briven_control?sslmode=disable
      BRIVEN_DATA_PLANE_URL: postgres://postgres:${BRIVEN_POSTGRES_PASSWORD}@postgres:5432/briven_data?sslmode=disable
      BRIVEN_REDIS_URL: redis://redis:6379
      BRIVEN_RUNTIME_URL: http://runtime:3003
      BRIVEN_RUNTIME_SHARED_SECRET: ${BRIVEN_RUNTIME_SHARED_SECRET}
      BRIVEN_BETTER_AUTH_SECRET: ${BRIVEN_BETTER_AUTH_SECRET}
      BRIVEN_AUDIT_IP_PEPPER: ${BRIVEN_AUDIT_IP_PEPPER}
      BRIVEN_ENCRYPTION_KEY: ${BRIVEN_ENCRYPTION_KEY}
      BRIVEN_MITTERA_API_URL: ${BRIVEN_MITTERA_API_URL:-}
      BRIVEN_MITTERA_API_KEY: ${BRIVEN_MITTERA_API_KEY:-}
      BRIVEN_MITTERA_WEBHOOK_SECRET: ${BRIVEN_MITTERA_WEBHOOK_SECRET:-}
      BRIVEN_GOOGLE_CLIENT_ID: ${BRIVEN_GOOGLE_CLIENT_ID:-}
      BRIVEN_GOOGLE_CLIENT_SECRET: ${BRIVEN_GOOGLE_CLIENT_SECRET:-}
      BRIVEN_GITHUB_CLIENT_ID: ${BRIVEN_GITHUB_CLIENT_ID:-}
      BRIVEN_GITHUB_CLIENT_SECRET: ${BRIVEN_GITHUB_CLIENT_SECRET:-}
      BRIVEN_KONNOS_CLIENT_ID: ${BRIVEN_KONNOS_CLIENT_ID:-}
      BRIVEN_KONNOS_CLIENT_SECRET: ${BRIVEN_KONNOS_CLIENT_SECRET:-}
      BRIVEN_KONNOS_ISSUER: ${BRIVEN_KONNOS_ISSUER:-https://code.konnos.org}
      BRIVEN_DISCORD_CLIENT_ID: ${BRIVEN_DISCORD_CLIENT_ID:-}
      BRIVEN_DISCORD_CLIENT_SECRET: ${BRIVEN_DISCORD_CLIENT_SECRET:-}
      BRIVEN_POLAR_API_BASE: ${BRIVEN_POLAR_API_BASE:-https://api.polar.sh}
      BRIVEN_POLAR_ACCESS_TOKEN: ${BRIVEN_POLAR_ACCESS_TOKEN:-}
      BRIVEN_POLAR_WEBHOOK_SECRET: ${BRIVEN_POLAR_WEBHOOK_SECRET:-}
      BRIVEN_POLAR_PRO_PRODUCT_ID: ${BRIVEN_POLAR_PRO_PRODUCT_ID:-}
      BRIVEN_POLAR_TEAM_PRODUCT_ID: ${BRIVEN_POLAR_TEAM_PRODUCT_ID:-}
      BRIVEN_DOMAIN: ${BRIVEN_DOMAIN}
      BRIVEN_OPEN_SIGNUPS: ${BRIVEN_OPEN_SIGNUPS:-false}
      BRIVEN_MINIO_ENDPOINT: http://minio:9000
      BRIVEN_MINIO_PUBLIC_ENDPOINT: https://s3.${BRIVEN_DOMAIN}
      BRIVEN_MINIO_ACCESS_KEY: briven
      BRIVEN_MINIO_SECRET_KEY: ${BRIVEN_POSTGRES_PASSWORD}
      BRIVEN_MINIO_BUCKET: ${BRIVEN_MINIO_BUCKET:-briven}
      BRIVEN_MINIO_REGION: ${BRIVEN_MINIO_REGION:-us-east-1}
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.briven-api.rule=Host(`api.${BRIVEN_DOMAIN}`)'
      - 'traefik.http.routers.briven-api.entrypoints=websecure'
      - 'traefik.http.routers.briven-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.briven-api.loadbalancer.server.port=3001'

  runtime:
    build:
      context: ../..
      dockerfile: apps/runtime/Dockerfile
    restart: unless-stopped
    logging: *briven-logging
    environment:
      BRIVEN_ENV: production
      BRIVEN_RUNTIME_PORT: '3003'
      BRIVEN_RUNTIME_SHARED_SECRET: ${BRIVEN_RUNTIME_SHARED_SECRET}
      BRIVEN_RUNTIME_EXECUTOR: deno
      BRIVEN_RUNTIME_BUNDLE_DIR: /var/lib/briven/bundles
    volumes:
      - runtime_bundles:/var/lib/briven/bundles
    networks:
      - dokploy-network

  realtime:
    build:
      context: ../..
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    logging: *briven-logging
    depends_on: [postgres]
    environment:
      BRIVEN_ENV: production
      BRIVEN_REALTIME_PORT: '3004'
      BRIVEN_API_INTERNAL_URL: http://api:3001
      BRIVEN_RUNTIME_SHARED_SECRET: ${BRIVEN_RUNTIME_SHARED_SECRET}
      BRIVEN_DATA_PLANE_URL: postgres://postgres:${BRIVEN_POSTGRES_PASSWORD}@postgres:5432/briven_data?sslmode=disable
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.briven-realtime.rule=Host(`realtime.${BRIVEN_DOMAIN}`)'
      - 'traefik.http.routers.briven-realtime.entrypoints=websecure'
      - 'traefik.http.routers.briven-realtime.tls.certresolver=letsencrypt'
      - 'traefik.http.services.briven-realtime.loadbalancer.server.port=3004'

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *briven-logging
    depends_on: [api]
    environment:
      BRIVEN_API_ORIGIN: https://api.${BRIVEN_DOMAIN}
      BRIVEN_WEB_ORIGIN: https://${BRIVEN_DOMAIN}
      NEXT_PUBLIC_BRIVEN_API_ORIGIN: https://api.${BRIVEN_DOMAIN}
      NEXT_PUBLIC_BRIVEN_HAS_GOOGLE_OAUTH: ${BRIVEN_GOOGLE_CLIENT_ID:+true}
      NEXT_PUBLIC_BRIVEN_HAS_GITHUB_OAUTH: ${BRIVEN_GITHUB_CLIENT_ID:+true}
      NEXT_PUBLIC_BRIVEN_HAS_KONNOS_OAUTH: ${BRIVEN_KONNOS_CLIENT_ID:+true}
      NEXT_PUBLIC_BRIVEN_HAS_DISCORD_OAUTH: ${BRIVEN_DISCORD_CLIENT_ID:+true}
      # Dashboard project cards link to ${studioOrigin}/project/${id} when set.
      # See apps/web/src/app/(dashboard)/dashboard/projects/projects-list.tsx.
      NEXT_PUBLIC_BRIVEN_STUDIO_ORIGIN: https://studio.${BRIVEN_DOMAIN}
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.briven-web.rule=Host(`${BRIVEN_DOMAIN}`) || Host(`app.${BRIVEN_DOMAIN}`)'
      - 'traefik.http.routers.briven-web.entrypoints=websecure'
      - 'traefik.http.routers.briven-web.tls.certresolver=letsencrypt'
      - 'traefik.http.services.briven-web.loadbalancer.server.port=3000'

  docs:
    build:
      context: ../..
      dockerfile: apps/docs/Dockerfile
    restart: unless-stopped
    logging: *briven-logging
    depends_on: [api]
    environment:
      # Used by the /status page + /api/status/incidents.xml RSS feed
      # to read live incidents from /v1/status/incidents.
      BRIVEN_API_ORIGIN: https://api.${BRIVEN_DOMAIN}
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.briven-docs.rule=Host(`docs.${BRIVEN_DOMAIN}`)'
      - 'traefik.http.routers.briven-docs.entrypoints=websecure'
      - 'traefik.http.routers.briven-docs.tls.certresolver=letsencrypt'
      - 'traefik.http.services.briven-docs.loadbalancer.server.port=3002'
      # status.briven.tech — routes to the same docs container, with a
      # path-rewrite so a bare `/` request lands on /status (the actual
      # status page lives in apps/docs/src/app/status). All other paths
      # pass through unchanged so /api/status/incidents.xml is still
      # reachable. See docs/runbooks/status-domain-cutover.md.
      - 'traefik.http.routers.briven-status.rule=Host(`status.${BRIVEN_DOMAIN}`)'
      - 'traefik.http.routers.briven-status.entrypoints=websecure'
      - 'traefik.http.routers.briven-status.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.briven-status.service=briven-docs'
      - 'traefik.http.routers.briven-status.middlewares=briven-status-rewrite'
      - 'traefik.http.middlewares.briven-status-rewrite.replacepathregex.regex=^/$$'
      - 'traefik.http.middlewares.briven-status-rewrite.replacepathregex.replacement=/status'

  # pg-meta — postgres-meta REST API consumed by studio for schema
  # introspection, table editor, SQL runner, RLS policies, etc. Studio
  # talks to it on the internal dokploy-network at http://meta:8080.
  # Not Traefik-exposed; never reachable from outside the network.
  # Phase A (decision X confirmed 2026-05-23): one shared pg-meta in the
  # control plane, pointed at briven_control. Per-project pg-meta is
  # tracked under task #10 (multi-tenant routing).
  meta:
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped
    logging: *briven-logging
    depends_on: [postgres]
    environment:
      PG_META_PORT: '8080'
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: '5432'
      PG_META_DB_NAME: briven_control
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${BRIVEN_POSTGRES_PASSWORD}
    networks:
      - dokploy-network

  # studio — forked supabase/studio Next.js app at studio.${BRIVEN_DOMAIN}.
  #
  # Env-var protocol (decision A confirmed 2026-05-23): source code reads
  # the upstream SUPABASE_* names directly (lib/constants/, pages/api/,
  # docker-entrypoint.sh). DO NOT rename to BRIVEN_* — the deployed
  # container would silently receive empty strings and every storage/auth
  # panel would 500. Treat SUPABASE_* as an internal protocol; rebrand
  # only user-facing surfaces.
  #
  # SUPABASE_URL points at api:3001 as a placeholder — briven's api does
  # not yet speak the gotrue/storage REST shapes upstream studio expects,
  # so the auth/storage panels will be partially broken until either (a)
  # kong is added to the stack or (b) those routes are proxied through
  # briven's api. The table editor + SQL editor + schema browser only
  # need STUDIO_PG_META_URL, so the original demo flow (#19) is unblocked.
  studio:
    build:
      context: ../..
      dockerfile: apps/studio/Dockerfile
      target: production
    restart: unless-stopped
    logging: *briven-logging
    depends_on: [postgres, meta]
    environment:
      # pg-meta endpoint — drives table editor, SQL runner, RLS, etc.
      STUDIO_PG_META_URL: http://meta:8080
      PG_META_CRYPTO_KEY: ${BRIVEN_ENCRYPTION_KEY}
      # SUPABASE_* — see comment block above for why these names are kept.
      # Placeholders until kong/gotrue/storage are wired into the stack.
      SUPABASE_URL: http://api:3001
      SUPABASE_PUBLIC_URL: https://api.${BRIVEN_DOMAIN}
      SUPABASE_ANON_KEY: ${BRIVEN_STUDIO_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${BRIVEN_STUDIO_SERVICE_KEY:-}
      # Direct DB connection (read by studio for migrations preview only;
      # everything else goes through pg-meta).
      POSTGRES_HOST: postgres
      POSTGRES_DB: briven_control
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${BRIVEN_POSTGRES_PASSWORD}
      # Self-hosted gates: studio shows a single org/project, not the
      # platform's multi-tenant chooser.
      NEXT_PUBLIC_IS_PLATFORM: 'false'
      NEXT_PUBLIC_SITE_URL: https://studio.${BRIVEN_DOMAIN}
      DEFAULT_ORGANIZATION_NAME: briven
      DEFAULT_PROJECT_NAME: Default
      # Dashboard basic-auth gate. Falls back to the upstream defaults
      # only if BRIVEN_STUDIO_* envs are unset; production MUST set them.
      DASHBOARD_USERNAME: ${BRIVEN_STUDIO_USERNAME:-briven}
      DASHBOARD_PASSWORD: ${BRIVEN_STUDIO_PASSWORD:-this_password_is_insecure_and_should_be_updated}
      AUTH_JWT_SECRET: ${BRIVEN_BETTER_AUTH_SECRET}
      # Sentry CLI noise during build; matches upstream default.
      SENTRY_IGNORE_API_RESOLUTION_ERROR: '1'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.briven-studio.rule=Host(`studio.${BRIVEN_DOMAIN}`)'
      - 'traefik.http.routers.briven-studio.entrypoints=websecure'
      - 'traefik.http.routers.briven-studio.tls.certresolver=letsencrypt'
      - 'traefik.http.services.briven-studio.loadbalancer.server.port=3000'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  runtime_bundles:

networks:
  dokploy-network:
    external: true
