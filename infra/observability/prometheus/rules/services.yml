# Alert rules. Routed via alertmanager → alertmanager-discord bridge →
# #briven-alerts (severity=critical|warning) or #briven-deploys (info).
# Severity labels MUST match the route matchers in
# infra/observability/alertmanager/alertmanager.yml.

groups:
  - name: briven-services
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} is unreachable'
          description: '/metrics on {{ $labels.instance }} has been down for >2 minutes.'

      - alert: HighErrorRate
        # Triggers when a service's 5xx rate exceeds 5% over the last 5
        # minutes. Requires the service to expose http_requests_total
        # with a `status` label — apps/api should add this when its
        # /metrics endpoint lands.
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
          sum by (service) (rate(http_requests_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} 5xx rate above 5%'

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'postgres has {{ $value }} active connections (>80)'
          description: 'pool exhaustion is likely if this trends up.'

  - name: briven-realtime
    interval: 30s
    rules:
      - alert: RealtimePollFailing
        # poll_error = the commit-diff poll itself threw (bad DSN, DoltGres
        # unreachable, missing project DB). Sustained errors mean live
        # updates have silently stopped for affected projects.
        expr: sum(rate(briven_realtime_poll_failures_total{reason="poll_error"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'realtime polling is erroring ({{ $value | humanize }}/s)'
          description: 'DoltGres commit-diff polling is failing — live updates may have stopped. Check the data-plane DSN / DoltGres health.'

      - alert: RealtimeFanoutLatencyHigh
        # p99 of change-detected → all-frames-shipped. The Phase 4.3 target
        # is p99 < 500ms; sustained breach means subscribers see stale data.
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(briven_realtime_fanout_latency_ms_bucket[5m]))
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'realtime fan-out p99 latency {{ $value | humanize }}ms (>500ms)'
          description: 'Re-invoke + frame ship is slow. Check api invoke latency, sub fan-out size, and poll interval.'

      - alert: RealtimeScopingDegraded
        # diff_fallback = DOLT_DIFF_SUMMARY errored or returned nothing while
        # HEAD moved, so the poller fell back to waking EVERY sub in the
        # project (pre-Phase-4 behaviour). Correctness is preserved (no missed
        # updates) but the per-table optimization is off — a perf regression.
        expr: sum(rate(briven_realtime_poll_failures_total{reason="diff_fallback"}[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'realtime per-table scoping degraded to fire-all ({{ $value | humanize }}/s)'
          description: 'DOLT_DIFF_SUMMARY is failing — every commit wakes every sub. Updates still deliver, but check DoltGres diff support / schema-prefix handling in poll-manager.ts.'
