# Scrape every briven service's /metrics endpoint. Container names match
# the apps/*/Dockerfile compose service names — adjust the static_configs
# targets if the deploy uses different DNS names.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['briven-api:3001']
        labels:
          service: api

  - job_name: runtime
    metrics_path: /metrics
    static_configs:
      - targets: ['briven-runtime:3003']
        labels:
          service: runtime

  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets: ['briven-realtime:3004']
        labels:
          service: realtime

  # postgres-exporter sidecar; not in this compose project — operator
  # adds it alongside the Postgres container in the data-plane compose.
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres
