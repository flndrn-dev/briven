# Observability stack — Grafana + Loki + Prometheus + Promtail.
#
# Single Dokploy compose project. Sits on the same docker network as
# apps/api, apps/runtime, apps/realtime so Prometheus can scrape their
# /metrics endpoints by container name. Grafana is exposed via Traefik
# behind Cloudflare Access; the rest are internal-only.
#
# See ./README.md for the operator runbook.

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: briven-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - briven

  loki:
    image: grafana/loki:3.3.2
    container_name: briven-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - briven

  promtail:
    image: grafana/promtail:3.3.2
    container_name: briven-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - briven

  grafana:
    image: grafana/grafana:11.4.0
    container_name: briven-grafana
    restart: unless-stopped
    environment:
      # Auth is via Cloudflare Access — Grafana itself runs without local
      # auth and trusts the upstream. The compose template lets the
      # operator override these for an air-gapped deploy.
      GF_AUTH_PROXY_ENABLED: 'true'
      GF_AUTH_PROXY_HEADER_NAME: 'cf-access-authenticated-user-email'
      GF_AUTH_PROXY_HEADER_PROPERTY: 'email'
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - briven
    labels:
      # Traefik-only routing; Cloudflare Access fronts the public hostname
      # and injects the cf-access-authenticated-user-email header.
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana.rule=Host(`grafana.briven.cloud`)'
      - 'traefik.http.routers.grafana.entrypoints=websecure'
      - 'traefik.http.routers.grafana.tls.certresolver=cloudflare'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3000'

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  briven:
    external: true
    name: briven
