# Observability stack — Grafana + Loki + Prometheus + Promtail.
#
# Single Dokploy compose project. Sits on the same docker network as
# apps/api, apps/runtime, apps/realtime so Prometheus can scrape their
# /metrics endpoints by container name. Grafana is exposed via Traefik
# behind Cloudflare Access; the rest are internal-only.
#
# See ./README.md for the operator runbook.

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - dokploy-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - dokploy-network

  # Translator sidecar — alertmanager webhook → discord webhook payload.
  # Two instances, one per channel, each holding a different webhook url.
  # The url is held inside the container's env so it never lands in the
  # repo. j sets DISCORD_WEBHOOK_ALERTS + DISCORD_WEBHOOK_DEPLOYS in the
  # dokploy project's environment.
  alertmanager-discord-alerts:
    image: benjojo/alertmanager-discord:latest
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_ALERTS}
      LISTEN_ADDRESS: ':9094'
    networks:
      - dokploy-network

  alertmanager-discord-deploys:
    image: benjojo/alertmanager-discord:latest
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_DEPLOYS}
      LISTEN_ADDRESS: ':9094'
    networks:
      - dokploy-network

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - dokploy-network

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - dokploy-network

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      # Local-auth mode — operator signs in with the bootstrap admin
      # password set via env. Promotable to cf-access proxy auth later
      # by overriding GF_AUTH_PROXY_ENABLED=true and the header vars.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dokploy-network'
      - 'traefik.http.routers.briven-grafana.rule=Host(`grafana.briven.tech`)'
      - 'traefik.http.routers.briven-grafana.entrypoints=websecure'
      - 'traefik.http.routers.briven-grafana.tls.certresolver=letsencrypt'
      - 'traefik.http.services.briven-grafana.loadbalancer.server.port=3000'

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:

networks:
  dokploy-network:
    external: true
