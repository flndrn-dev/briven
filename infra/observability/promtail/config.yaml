# Promtail discovers docker containers on the host and ships their
# stdout/stderr to Loki. Each line is parsed as JSON when possible —
# briven services emit one JSON-per-line via @briven/shared/observability,
# so structured fields land as Loki labels for free.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://briven-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use the docker container name as the `container` label.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: container
      # Surface compose service + project as labels too.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      # Only ship containers tagged for log collection — keeps Loki ingest
      # focused on briven services rather than every random container on
      # the host.
      - source_labels: ['__meta_docker_container_label_briven_logs']
        regex: 'true'
        action: keep
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            env: env
      - labels:
          level:
          service:
          env:
