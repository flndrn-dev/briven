# Forgejo Actions — runs on every push and pull-request to main.
# If you don't have a runner registered yet:
#   docker run -d --name forgejo-runner --restart=unless-stopped \
#     -v $PWD/runner:/data \
#     code.forgejo.org/forgejo/runner:6 \
#     forgejo-runner register --no-interactive \
#       --instance https://code.konnos.org \
#       --token <token-from-Site Admin → Runners→ Create Runner> \
#       --name briven-ci \
#       --labels docker
# Until then the workflow queues silently — no harm.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run on the same ref when a new push lands —
# saves runner minutes during quick iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: docker
    container:
      image: oven/bun:1.3
    # Real DoltGres alongside the job so the data-plane alarms
    # (apps/api/src/db/*.integration.test.ts) actually RUN instead of
    # self-skipping. This is the net that stops DoltGres incompatibilities
    # (ILIKE, SET LOCAL, citext, vector, ON CONFLICT DO UPDATE, …) from
    # reaching production. Reachable from the job container as host `doltgres`.
    # See specs/briven-sprint-plan.md (S0.5). NOTE: only fires once a Forgejo
    # runner is registered (see header); until then the local alarm is the net.
    services:
      doltgres:
        image: dolthub/doltgresql:latest
        env:
          DOLTGRES_USER: postgres
          DOLTGRES_PASSWORD: password
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1

      - name: install pnpm
        run: |
          npm install -g pnpm@9.12.0
          pnpm --version

      - name: cache pnpm store
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: install
        # frozen lockfile = lockfile drift fails the build,
        # which is what we want.
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm -r lint

      - name: typecheck
        run: pnpm -r typecheck

      - name: wait for DoltGres
        # The TCP port opening is a good-enough readiness signal for DoltGres
        # (it accepts SQL as soon as the wire port is up). bash + /dev/tcp are
        # available in the debian-based oven/bun image.
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/doltgres/5432) 2>/dev/null; then echo "DoltGres up"; exit 0; fi
            sleep 2
          done
          echo "DoltGres did not come up in time" >&2
          exit 1

      - name: test
        # bun is already in the container image; -r runs each
        # workspace's own test script. BRIVEN_DATA_PLANE_URL makes the
        # data-plane integration alarms run against the DoltGres service.
        run: pnpm -r test
        env:
          BRIVEN_DATA_PLANE_URL: postgres://postgres:password@doltgres:5432/postgres
